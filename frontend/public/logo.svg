<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ── Icon: hexagonal mesh, center (120, 68), hex radius 46 ───────────── -->

  <!-- Ambient glow -->
  <circle cx="120" cy="68" r="50" fill="url(#outerGlow)"/>

  <!-- Cross-mesh lines -->
  <line x1="120" y1="22" x2="160" y2="91" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>
  <line x1="160" y1="45" x2="80"  y2="91" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>
  <line x1="160" y1="91" x2="80"  y2="45" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>
  <line x1="120" y1="114" x2="80" y2="45" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>
  <line x1="120" y1="114" x2="160" y2="45" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>
  <line x1="120" y1="22"  x2="80" y2="91" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.13"/>

  <!-- Outer hexagon ring -->
  <polygon
    points="120,22 160,45 160,91 120,114 80,91 80,45"
    fill="none"
    stroke="#f97316"
    stroke-width="1.1"
    stroke-opacity="0.28"
    stroke-linejoin="round"
  />

  <!-- Spokes: center → outer nodes -->
  <line x1="120" y1="68" x2="120" y2="22"  stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>
  <line x1="120" y1="68" x2="160" y2="45"  stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>
  <line x1="120" y1="68" x2="160" y2="91"  stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>
  <line x1="120" y1="68" x2="120" y2="114" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>
  <line x1="120" y1="68" x2="80"  y2="91"  stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>
  <line x1="120" y1="68" x2="80"  y2="45"  stroke="#f97316" stroke-width="1.5" stroke-opacity="0.58"/>

  <!-- Outer node halos -->
  <circle cx="120" cy="22"  r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>
  <circle cx="160" cy="45"  r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>
  <circle cx="160" cy="91"  r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>
  <circle cx="120" cy="114" r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>
  <circle cx="80"  cy="91"  r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>
  <circle cx="80"  cy="45"  r="6" fill="#f97316" fill-opacity="0.2" filter="url(#nodeShadow)"/>

  <!-- Outer nodes solid -->
  <circle cx="120" cy="22"  r="3.2" fill="#f97316"/>
  <circle cx="160" cy="45"  r="3.2" fill="#f97316"/>
  <circle cx="160" cy="91"  r="3.2" fill="#f97316"/>
  <circle cx="120" cy="114" r="3.2" fill="#f97316"/>
  <circle cx="80"  cy="91"  r="3.2" fill="#f97316"/>
  <circle cx="80"  cy="45"  r="3.2" fill="#f97316"/>

  <!-- Center node glow + ring + core -->
  <circle cx="120" cy="68" r="11" fill="url(#centerGlow)"/>
  <circle cx="120" cy="68" r="7.5" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.38"/>
  <circle cx="120" cy="68" r="4.5" fill="#f97316"/>

  <!-- ── Wordmark below icon ───────────────────────────────────────────────── -->

  <!-- "CreditMesh" — all white -->
  <text
    x="120" y="153"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.8"
    fill="#ffffff"
  >CreditMesh</text>

  <!-- Tagline -->
  <text
    x="120" y="172"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="9"
    font-weight="500"
    fill="#6b6b80"
    letter-spacing="1.8"
  >P2P AGENT CREDIT NETWORK</text>
</svg>

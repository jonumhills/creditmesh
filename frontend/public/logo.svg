<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ── Icon: hexagonal mesh (72×72 box, center 36,36) ─────────────────── -->

  <!-- Ambient glow -->
  <circle cx="36" cy="36" r="32" fill="url(#outerGlow)"/>

  <!-- Cross-mesh lines (faintest, drawn first) -->
  <line x1="36" y1="12" x2="57" y2="48" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="57" y1="24" x2="15" y2="48" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="57" y1="48" x2="15" y2="24" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="36" y1="60" x2="15" y2="24" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="36" y1="60" x2="57" y2="24" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>
  <line x1="36" y1="12" x2="15" y2="48" stroke="#f97316" stroke-width="0.7" stroke-opacity="0.12"/>

  <!-- Outer hexagon ring -->
  <polygon
    points="36,12 57,24 57,48 36,60 15,48 15,24"
    fill="none"
    stroke="#f97316"
    stroke-width="1"
    stroke-opacity="0.28"
    stroke-linejoin="round"
  />

  <!-- Spokes: center → outer nodes -->
  <line x1="36" y1="36" x2="36"  y2="12" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="36" y1="36" x2="57"  y2="24" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="36" y1="36" x2="57"  y2="48" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="36" y1="36" x2="36"  y2="60" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="36" y1="36" x2="15"  y2="48" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="36" y1="36" x2="15"  y2="24" stroke="#f97316" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- Outer node glows (blurred halos) -->
  <circle cx="36" cy="12" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>
  <circle cx="57" cy="24" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>
  <circle cx="57" cy="48" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>
  <circle cx="36" cy="60" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>
  <circle cx="15" cy="48" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>
  <circle cx="15" cy="24" r="5" fill="#f97316" fill-opacity="0.18" filter="url(#nodeShadow)"/>

  <!-- Outer nodes (solid) -->
  <circle cx="36" cy="12" r="2.8" fill="#f97316"/>
  <circle cx="57" cy="24" r="2.8" fill="#f97316"/>
  <circle cx="57" cy="48" r="2.8" fill="#f97316"/>
  <circle cx="36" cy="60" r="2.8" fill="#f97316"/>
  <circle cx="15" cy="48" r="2.8" fill="#f97316"/>
  <circle cx="15" cy="24" r="2.8" fill="#f97316"/>

  <!-- Center node glow -->
  <circle cx="36" cy="36" r="9" fill="url(#centerGlow)"/>
  <!-- Center node ring -->
  <circle cx="36" cy="36" r="6" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Center node core -->
  <circle cx="36" cy="36" r="4" fill="#f97316"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────────── -->

  <!-- "Credit" white + "Mesh" orange, tracked tight -->
  <text
    x="88" y="40"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.8"
  >
    <tspan fill="#ffffff">Credit</tspan><tspan fill="#f97316">Mesh</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="89" y="55"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="9.5"
    font-weight="500"
    fill="#6b6b80"
    letter-spacing="1.4"
  >P2P AGENT CREDIT NETWORK</text>
</svg>

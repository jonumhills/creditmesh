<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Ambient -->
  <circle cx="32" cy="32" r="28" fill="url(#cg)"/>

  <!-- Cross diagonals -->
  <line x1="32" y1="9"  x2="55" y2="44.5" stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="55" y1="21" x2="9"  y2="44.5" stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="55" y1="44.5" x2="9" y2="21"  stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="32" y1="55" x2="9"  y2="21"   stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="32" y1="55" x2="55" y2="21"   stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>
  <line x1="32" y1="9"  x2="9"  y2="44.5" stroke="#f97316" stroke-width="0.6" stroke-opacity="0.12"/>

  <!-- Outer hex ring -->
  <polygon
    points="32,9 55,21 55,44.5 32,55 9,44.5 9,21"
    fill="none"
    stroke="#f97316"
    stroke-width="1"
    stroke-opacity="0.25"
    stroke-linejoin="round"
  />

  <!-- Spokes -->
  <line x1="32" y1="32" x2="32" y2="9"    stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="32" x2="55" y2="21"   stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="32" x2="55" y2="44.5" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="55"   stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="32" x2="9"  y2="44.5" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="32" x2="9"  y2="21"   stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Outer node halos -->
  <circle cx="32" cy="9"    r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="55" cy="21"   r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="55" cy="44.5" r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="32" cy="55"   r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="9"  cy="44.5" r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="9"  cy="21"   r="5" fill="#f97316" fill-opacity="0.2" filter="url(#glow)"/>

  <!-- Outer nodes -->
  <circle cx="32" cy="9"    r="3" fill="#f97316"/>
  <circle cx="55" cy="21"   r="3" fill="#f97316"/>
  <circle cx="55" cy="44.5" r="3" fill="#f97316"/>
  <circle cx="32" cy="55"   r="3" fill="#f97316"/>
  <circle cx="9"  cy="44.5" r="3" fill="#f97316"/>
  <circle cx="9"  cy="21"   r="3" fill="#f97316"/>

  <!-- Center glow -->
  <circle cx="32" cy="32" r="10" fill="url(#cg)"/>
  <circle cx="32" cy="32" r="7"  fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="4.5" fill="#f97316"/>
</svg>
